<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>دليل خدام ومخدومي كنيسة الأنبا بيشوي - المنيا الجديدة</title>
<meta name="description" content="نظام إدارة بيانات الخدام والمخدومين - إيبارشية شرق المنيا للأقباط الأرثوذكس" />
<meta name="theme-color" content="#FAF6EC" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10" />
<link rel="stylesheet" href="calendar/calendar.css?v=3" />
</head>
<body>

<!--
  App bar (mobile-app style): sticky, translucent over the church background,
  holds the church identity + the back button + the admin toggle.
  #topNav keeps receiving its markup from app.js / bible.js /
  coptic-calendar.js exactly as before (renderChrome, renderVisitationChrome,
  BibleUI.chrome, CalendarUI.chrome) — only its presentation changed.
-->
<header class="app-bar" id="appBar">
  <div class="app-bar-inner container">
    <a class="app-bar-brand" href="#/" aria-label="الصفحة الرئيسية">
      <img class="brand-logo" src="logo.jpg" alt="شعار الكنيسة" />
      <span class="brand-titles">
        <h1 class="brand-church">كنيسة الأنبا بيشوي بالمنيا الجديدة</h1>
        <p class="brand-tagline" id="brandTagline">دليل الخدام لمتابعة الافتقاد</p>
      </span>
    </a>
    <div id="topNav" class="top-nav"></div>
  </div>
  <span class="app-bar-accent" aria-hidden="true"></span>
</header>

<!-- Church identity banner: eparchy line + the section's verse. Shown on the
     main hub screens; hidden on inner screens so content starts higher. -->
<section class="brand-hero" id="brandHero">
  <div class="container brand-hero-inner">
    <p class="brand-eparchy">إيبارشية شرق المنيا للأقباط الأرثوذكس</p>
    <figure class="hero-verse-card">
      <span class="hero-ornament" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M5 8h14"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="8" r="1" fill="currentColor" stroke="none"/></svg>
      </span>
      <p class="brand-verse" id="brandVerse">ثُمَّ قَالَ بُولُسُ لِبَرْنَابَا: لِنَرْجِعْ وَنَفْتَقِدْ إِخْوَتَنَا فِي كُلِّ مَدِينَةٍ نَادَيْنَا فِيهَا بِكَلِمَةِ الرَّبِّ كَيْفَ هُمْ.</p>
      <p class="brand-verse-ref" id="brandVerseRef">أَعْمَالُ الرُّسُلِ ١٥ : ٣٦</p>
    </figure>
  </div>
</section>

<main id="mainContent">
  <noscript><div class="container" style="padding:30px 0;">هذا الموقع يحتاج تفعيل JavaScript في المتصفح لعرض البيانات.</div></noscript>
  <div id="app"></div>
</main>

<footer class="site-footer" id="siteFooter">
  <a href="#/admin" class="btn btn-outline btn-sm">صفحة إدارة البيانات</a>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Bottom tab bar: the app's main navigation. Every tab is an existing route
     (hash router untouched) — only the navigation chrome is new. -->
<nav class="tab-bar" id="tabBar" aria-label="التنقل الرئيسي">
  <div class="tab-bar-inner">
    <a class="tab-item" href="#/" data-tab="home">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21H3z"/><path d="M9 21v-7h6v7"/></svg></span>
      <span class="tab-label">الرئيسية</span>
    </a>
    <a class="tab-item" href="#/home" data-tab="directory">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></svg></span>
      <span class="tab-label">الخدام</span>
    </a>
    <a class="tab-item" href="#/visitation" data-tab="visitation">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M10 4h4M4 22V11l8-6 8 6v11M4 22h16M9 22v-6h6v6"/></svg></span>
      <span class="tab-label">الافتقاد</span>
    </a>
    <a class="tab-item" href="#/bible" data-tab="bible">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-2-1.5-5-2-8-2v16c3 0 6 .5 8 2 2-1.5 5-2 8-2V3c-3 0-6 .5-8 2z"/><path d="M12 5v16"/></svg></span>
      <span class="tab-label">الكتاب المقدس</span>
    </a>
    <a class="tab-item" href="#/admin" data-tab="admin">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M19 7h1M4 17h5M15 17h5"/><circle cx="16" cy="7" r="2.2"/><circle cx="12" cy="17" r="2.2"/></svg></span>
      <span class="tab-label">الإدارة</span>
    </a>
  </div>
</nav>

<!-- Route progress bar: subtle loading feedback while a screen is rendering. -->
<div class="route-progress" id="routeProgress" aria-hidden="true"><span></span></div>

<script src="db.js?v=3"></script>
<script src="bible/bible.js?v=5"></script>
<script src="calendar/coptic-calendar.js?v=2"></script>
<script src="app.js?v=11"></script>
<script src="app-shell.js?v=1"></script>
<script>
  // Offline support: register the service worker so the app's own files
  // (HTML/CSS/JS) keep working with no internet connection. IndexedDB data
  // already works offline on its own; this only caches the app shell.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>

</html>
