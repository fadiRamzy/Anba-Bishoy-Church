# ==========================================================================
#  Cloudflare Worker configuration for the "مشاركة البيانات" Telegram relay.
#
#  TELEGRAM_BOT_TOKEN is intentionally NOT here. It is a Worker *secret*:
#      cd telegram-relay
#      npx wrangler secret put TELEGRAM_BOT_TOKEN
#  Secrets are stored encrypted by Cloudflare and are never part of this file,
#  the bundle, or the git history.
#
#  Non-secret settings live in [vars] below.
# ==========================================================================

name = "anba-bishoy-telegram-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

# Free tier only: no bindings, no KV, no D1, no cron.
# A single request = one Worker invocation + one call to api.telegram.org.

[vars]
# NOTE: TELEGRAM_CHAT_ID is deliberately NOT here. Both credentials are set as
# Worker secrets so there is no placeholder that could silently win and post to
# the wrong chat:
#     wrangler secret put TELEGRAM_BOT_TOKEN
#     wrangler secret put TELEGRAM_CHAT_ID

# Only these origins may call the relay. Add your custom domain if you get one.
ALLOWED_ORIGINS = "https://fadiramzy.github.io"

# Optional hard cap on the uploaded JSON size (bytes). Default 4 MB.
MAX_JSON_BYTES = "4194304"

# TELEGRAM_API_BASE is left unset on purpose: it defaults to
# https://api.telegram.org. Only the automated tests override it (to point at
# a mock API), via the environment.
