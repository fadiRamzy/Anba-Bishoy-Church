name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ Main ]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app-shell.js'
      - 'db.js'
      - 'capacitor-bridge.js'
      - 'styles.css'
      - 'seed.json'
      - 'service-worker.js'
      - '*.jpg'
      - '*.webp'
      - 'bible/**'
      - 'calendar/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write # allows the final step to publish the built APK to the repo root

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Populate www/ from website root (includes the native bridge)
        run: node scripts/sync-web.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ubuntu-latest runners ship with a preinstalled Android SDK
      # (ANDROID_HOME / ANDROID_SDK_ROOT). Failing android-actions/setup-android
      # was removed; verify the SDK instead of re-installing it.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" || (echo "::error::Android SDK not found on the runner" && exit 1)
          java -version

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anba-bishoy-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # The Administration page's "تنزيل / تحديث التطبيق" button downloads
      # this file, so the published APK must always be the latest build.
      # Pushing binaries back to Main is rejected (protected branch), so the
      # APK is published to the fixed, public "android-latest" release instead.
      # The button and the in-app bridge download from that exact URL.
      - name: Publish APK to the android-latest release (download/update distribution)
        if: github.ref == 'refs/heads/Main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Anba-Bishoy-Church.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Anba-Bishoy-Church.apk --clobber
          else
            gh release create android-latest Anba-Bishoy-Church.apk \
              --title 'تطبيق الكنيسة (Android) — أحدث نسخة' \
              --notes 'أحدث بناء لأندرويد يُنشر تلقائيًا من سير عمل Build Android عند كل تحديث على Main.'
          fi
